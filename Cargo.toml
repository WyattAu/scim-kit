[package]
name = "scim-kit"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Self-contained SCIM 2.0 (RFC 7644) provisioning types, stores, and optional axum router"
repository = "https://github.com/WyattAu/scim-kit"
keywords = ["scim", "provisioning", "rfc7644", "identity"]
categories = ["authentication"]

[features]
default = []
axum = ["dep:axum"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dashmap = "6"
axum = { version = "0.8", optional = true }

[package.metadata.layers]
tier = "L3"
